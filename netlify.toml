[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# `netlify dev` runs Vite and the functions together on http://localhost:8888
[dev]
  command = "npm run dev"
  targetPort = 5173
  framework = "#custom"

# WebMCP (AI agent tools, see src/lib/webmcp.js) needs an origin-isolated document. Said explicitly so a
# later header change can't silently turn it off; tools=(self) keeps cross-origin iframes away from the tools.
[[headers]]
  for = "/*"
  [headers.values]
    Origin-Agent-Cluster = "?1"
    Permissions-Policy = "tools=(self)"
